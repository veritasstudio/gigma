<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join · Gigma</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell join">
    <header class="brand">
      <div class="logo">G</div>
      <div>
        <h1>Join session</h1>
        <p class="muted">Open link · enter your name · go. No login.</p>
      </div>
    </header>
    <section class="card">
      <label for="name">Your name</label>
      <input id="name" type="text" placeholder="Your name" autocomplete="nickname" autofocus />
      <button id="join" class="primary" type="button">Join</button>
      <p id="err" class="error" hidden></p>
    </section>
  </main>
  <script>
    const id = location.pathname.split('/').filter(Boolean).pop();
    const nameEl = document.getElementById('name');
    const join = document.getElementById('join');
    const err = document.getElementById('err');
    const saved = sessionStorage.getItem('gigma:name');
    if (saved) nameEl.value = saved;

    async function go() {
      err.hidden = true;
      const name = nameEl.value.trim();
      if (!name) {
        err.textContent = 'Enter your name to join.';
        err.hidden = false;
        nameEl.focus();
        return;
      }
      join.disabled = true;
      try {
        const res = await fetch('/api/sessions/' + id + '/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not join');
        sessionStorage.setItem('gigma:name', name);
        sessionStorage.setItem('gigma:guestId', data.guest && data.guest.id || '');
        if (data.aooEndpoint) sessionStorage.setItem('gigma:aoo', data.aooEndpoint);
        location.href = '/m/' + id + '/room?name=' + encodeURIComponent(name);
      } catch (e) {
        err.textContent = e.message || String(e);
        err.hidden = false;
      } finally {
        join.disabled = false;
      }
    }
    join.onclick = go;
    nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  </script>
</body>
</html>
